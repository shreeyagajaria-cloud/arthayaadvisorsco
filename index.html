<script>
document.addEventListener("DOMContentLoaded", function () {

  const revealElements = document.querySelectorAll(
    ".hero-copy, .hero-visual, .section-heading, .commitment-card, .philosophy-mark, .philosophy-copy, .service-card, .contact-panel, .contact-meta, .question-box"
  );

  /*
    Give groups a slight stagger.
  */
  const staggerGroups = [
    ".commitment-card",
    ".service-card"
  ];

  revealElements.forEach((element) => {
    element.classList.add("reveal");
  });

  staggerGroups.forEach((selector) => {

    document.querySelectorAll(selector).forEach((element, index) => {
      element.style.transitionDelay = `${index * 0.08}s`;
    });

  });


  /*
    Animate BOTH directions.

    When an element enters the screen:
      -> add "active"

    When it leaves:
      -> remove "active"

    Therefore scrolling back up causes it
    to animate again.
  */
  const observer = new IntersectionObserver(

    (entries) => {

      entries.forEach((entry) => {

        if (entry.isIntersecting) {

          entry.target.classList.add("active");

        } else {

          entry.target.classList.remove("active");

        }

      });

    },

    {
      threshold: 0.14,

      /*
        Keeps the animation from triggering
        too early at the very edge of the screen.
      */
      rootMargin: "-20px 0px -20px 0px"
    }

  );


  revealElements.forEach((element) => {
    observer.observe(element);
  });

});
</script>
